<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>語彙と文法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script src="./app.js" defer></script>
</head>
<body>
<div class="page">
  <div class="sheet" id="sheet" role="group" aria-label="答案欄"></div>

  <main class="body">
    <div id="quiz"><p class="state">正在讀取題庫…</p></div>
    <section class="score" id="score" role="status">
      <p id="scoreMsg"></p>
      <p class="sub" id="scoreHint"></p>
    </section>
    <div class="act">
      <button class="go" id="next" type="button" hidden>下一題</button>
      <button class="go" id="again" type="button" hidden>換一組題目</button>
    </div>
  </main>

  <footer>
    <p>語彙と文法</p>
    <p id="meta">読み込み中…</p>
  </footer>
</div>
</body>
</html>
