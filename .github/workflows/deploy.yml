name: Build and deploy quiz

on:
  schedule:
    # 每天台灣時間早上 7:00（UTC 23:00）重新抓一次 Notion
    - cron: '0 23 * * *'
  workflow_dispatch:        # 也可以在 Actions 頁面手動按下執行
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate quiz bank from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ARTICLES_PAGE_ID: ${{ vars.ARTICLES_PAGE_ID }}
          GRAMMAR_PAGE_ID: ${{ vars.GRAMMAR_PAGE_ID }}
        run: python scripts/build_quiz.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
